# ... below the joy parameters

teleop_twist_joy:
  ros__parameters:
    use_sim_time: false
    axis_linear:  # Left thumb stick vertical
      x: 1
    scale_linear:
      x: 1.0
    scale_linear_turbo:
      x: 2.0

    axis_angular:  # Left thumb stick horizontal
      yaw: 0
    scale_angular:
      yaw: 0.7
    scale_angular_turbo:
      yaw: 1.5

    require_enable_button: false
    enable_turbo_button: 7  # Right shoulder button